# Nahraje hotový web na FTP — tedy NAOSTRO, na vlastní doménu.
#
# Spouští se JEN RUČNĚ tlačítkem: karta Actions → „Naostro na FTP" →
# „Run workflow". Schválně tu není `on: push`. Draft na GitHub Pages se
# nasazuje sám při každé změně v `main`, tým si ho projde, a teprve když ho
# odsouhlasí, pustí se tenhle běh. Jde to i z VS Code přes rozšíření
# GitHub Actions.
#
# Přihlašovací údaje se vyplňují v Settings → Secrets and variables →
# Actions. Do Secrets patří troje:
#
#   FTP_SERVER    adresa FTP serveru, třeba ftp.transparentnivyskov.cz
#   FTP_UZIVATEL  přihlašovací jméno
#   FTP_HESLO     heslo
#
# Do Variables (vedlejší záložka) pak složka a případné úlevy u certifikátu:
#
#   FTP_ADRESAR             složka, kterou hosting servíruje jako web,
#                           obvykle /public_html/
#   FTP_KONTROLOVAT_JMENO   nastavte na „ne", když certifikát serveru zní na
#                           jiné jméno, než přes které se připojujeme
#   FTP_OVERIT_CERTIFIKAT   nastavte na „ne", až kdyby nepomohlo to předchozí
#
# Adresář schválně není secret: hodnoty ze secrets GitHub v záznamu maskuje
# hvězdičkami a v diagnostickém výpisu by pak nebylo vidět, kam se nahrálo.
#
# POZOR, tohle je ta nebezpečná část: nahrávání je zrcadlení. Co je ve složce
# na serveru navíc oproti sestavenému webu, to se SMAŽE — jinak by tam po
# každé změně zůstávaly staré stránky. Kdyby byl FTP_ADRESAR špatně a mířil
# třeba do kořene FTP, zrcadlení by smazalo i věci, které s webem nesouvisí.
# Proti tomu je pojistka, která napřed nanečisto spočítá, kolik souborů by
# zmizelo, a nad sto se zastaví.
#
# ────────────────────────────────────────────────────────────────────────
# PRAVIDLO PRO ÚPRAVY: příkazy pro lftp se skládají do souboru přes `echo`
# a spouštějí přesměrováním. Dřív se psaly rovnou do shellového heredocu
# a dvakrát to kvůli tomu spadlo: heredoc nesmí být v uvozovkách, aby se
# v něm daly použít proměnné — jenže pak shell vyhodnotí i zpětné apostrofy
# a spustí, co je mezi nimi. Stačil komentář se slovem v apostrofech
# a nasazení skončilo na „mirror: command not found".
#
# Do souboru s příkazy proto nepatří žádné komentáře. Vysvětlivky patří
# sem do YAML, kde je shell nikdy neuvidí.
# ────────────────────────────────────────────────────────────────────────

name: Naostro na FTP

on:
  workflow_dispatch:
    inputs:
      zkusebni_soubor:
        description: 'Jen zkušební soubor — ověřit přístupy a vypsat obsah složky, web nechat být'
        type: boolean
        default: false
      nanecisto:
        description: 'Jen nanečisto — vypsat, co by se stalo, a nic nenahrávat'
        type: boolean
        default: false
      velky_uklid:
        description: 'Povolit i velký úklid (potřeba při prvním nahrání přes starý web)'
        type: boolean
        default: false

# Dvě nahrávání naráz by si na serveru lezla do zelí. Rozdělaný běh se
# nepřerušuje — přerušit nahrávání v půlce by nechalo web rozbitý.
concurrency:
  group: ftp-naostro
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Nad tolik smazaných souborů se běh zastaví a počká na potvrzení.
  STROP_MAZANI: 100
  WEB: https://transparentnivyskov.cz

jobs:
  naostro:
    runs-on: ubuntu-latest
    # Bez tohohle by zaseknuté spojení viselo šest hodin, což je výchozí
    # strop GitHubu. Nahrání trvá jednotky minut.
    timeout-minutes: 30
    steps:
      - name: Zkontrolovat, že jsou vyplněné údaje
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          UZIVATEL: ${{ secrets.FTP_UZIVATEL }}
          HESLO: ${{ secrets.FTP_HESLO }}
          ADRESAR: ${{ vars.FTP_ADRESAR || secrets.FTP_ADRESAR }}
        run: |
          chybi=""
          [ -z "$SERVER" ] && chybi="$chybi FTP_SERVER"
          [ -z "$UZIVATEL" ] && chybi="$chybi FTP_UZIVATEL"
          [ -z "$HESLO" ] && chybi="$chybi FTP_HESLO"
          [ -z "$ADRESAR" ] && chybi="$chybi FTP_ADRESAR"
          if [ -n "$chybi" ]; then
            echo "Chybi tyto udaje:$chybi"
            echo "Doplnte je v Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Stáhnout zdrojové soubory
        if: inputs.zkusebni_soubor == false
        uses: actions/checkout@v7

      - name: Připravit Node.js
        if: inputs.zkusebni_soubor == false
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Nainstalovat závislosti
        if: inputs.zkusebni_soubor == false
        run: npm ci

      # NAOSTRO=1 přepne odkazy z podsložky /TV-web/ do kořene domény
      # a shodí pruh „Náhled" i noindex.
      - name: Sestavit web naostro
        if: inputs.zkusebni_soubor == false
        env:
          NAOSTRO: '1'
        run: npm run build

      # Levná pojistka. Kdyby se NAOSTRO někdy přestalo propisovat, chyba se
      # pozná tady, ne až na doméně.
      - name: Ověřit, že sestavení není draft
        if: inputs.zkusebni_soubor == false
        run: |
          if grep -q "noindex" dist/index.html; then
            echo "Sestaveni ma noindex, tedy je to draft. Naostro se nenahraje."
            exit 1
          fi
          if grep -q '"/TV-web/' dist/index.html; then
            echo "Sestaveni ma odkazy do podslozky /TV-web/, tedy je to draft."
            exit 1
          fi
          if grep -rq "toto zatim neni zivy web\|toto zatím není živý web" dist/; then
            echo "Sestaveni ma pruh 'Nahled', tedy je to draft."
            exit 1
          fi
          echo "V poradku: sestaveni je ostre."

      # Schválně obyčejné lftp, ne hotová akce z Marketplace: přihlašovací
      # údaje k ostrému webu tak neopustí běh u GitHubu.
      - name: Nainstalovat lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Nastavení, které je stejné pro všechna připojení, se sestaví jednou
      # sem do souboru a jednotlivé kroky si ho pak jen předřadí svým
      # příkazům. Dřív se opisovalo třikrát a rozcházelo se.
      #
      # K jednotlivým volbám:
      #   ssl-force        heslo nesmí jít po drátě otevřeně
      #   list-options -a  bez toho server neuvádí soubory začínající tečkou
      #                    a nepřenesl by se .htaccess
      #   connection-limit lftp má protáhnout všechno jedním spojením. Zrcadlení
      #                    si jinak otevírá druhé vedle toho, přes které
      #                    vypisuje složky, a sdílené hostingy mívají počet
      #                    souběžných přihlášení omezený — často na jedno.
      #                    Přesně tím se lišilo nahrání jednoho souboru, které
      #                    procházelo vždycky, od zrcadlení, které padalo.
      #   debug 3          vypisuje odpovědi serveru, aby v záznamu bylo vidět,
      #                    proč to případně selhalo, jeho vlastními slovy
      - name: Připravit nastavení připojení
        env:
          FTP_KONTROLOVAT_JMENO: ${{ vars.FTP_KONTROLOVAT_JMENO }}
          FTP_OVERIT_CERTIFIKAT: ${{ vars.FTP_OVERIT_CERTIFIKAT }}
        run: |
          if [ "${FTP_OVERIT_CERTIFIKAT:-ano}" = "ne" ]; then
            CERT="set ssl:verify-certificate false"
            echo ">> Certifikat: neoveruji vubec (spojeni je porad sifrovane)"
          elif [ "${FTP_KONTROLOVAT_JMENO:-ano}" = "ne" ]; then
            CERT="set ssl:verify-certificate true"$'\n'"set ssl:check-hostname false"
            echo ">> Certifikat: overuji, na jmeno se neptam"
          else
            CERT="set ssl:verify-certificate true"$'\n'"set ssl:check-hostname true"
            echo ">> Certifikat: overuji certifikat i jmeno"
          fi

          {
            echo "set ftp:ssl-force true"
            echo "set ftp:ssl-protect-data true"
            echo "set ftp:list-options -a"
            echo "set ftp:passive-mode true"
            echo "set ftp:prefer-epsv false"
            echo "$CERT"
            echo "set net:connection-limit 1"
            echo "set mirror:parallel-transfer-count 1"
            echo "set net:max-retries 3"
            echo "set net:timeout 40"
            echo "set net:reconnect-interval-base 5"
            echo "set cmd:fail-exit true"
            echo "debug 3"
          } > spojeni.lftp

          echo "Nastaveni pripojeni:"
          cat spojeni.lftp

      # Projít starý web přes FTP je nejpomalejší část celého nasazení, proto
      # vlastní strop. Při velkém úklidu se krok přeskakuje: existuje jen kvůli
      # pojistce níž, a tu velký úklid stejně přebíjí.
      - name: Spočítat nanečisto, co by se smazalo
        if: inputs.zkusebni_soubor == false && inputs.velky_uklid == false
        id: zkouska
        timeout-minutes: 10
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          UZIVATEL: ${{ secrets.FTP_UZIVATEL }}
          LFTP_PASSWORD: ${{ secrets.FTP_HESLO }}
          ADRESAR: ${{ vars.FTP_ADRESAR || secrets.FTP_ADRESAR }}
        run: |
          ADR="${ADRESAR%/}"
          cp spojeni.lftp prikazy.lftp
          {
            echo "mirror --reverse --delete --dry-run --verbose --exclude-glob .well-known/ dist/ \"$ADR\""
            echo "bye"
          } >> prikazy.lftp

          lftp -u "$UZIVATEL" --env-password "$SERVER" < prikazy.lftp > nanecisto.txt 2>&1 || true

          VZOR='^(rm|rmdir) |Removing old'
          smaze=$(grep -c -E "$VZOR" nanecisto.txt || true)
          echo "smaze=$smaze" >> $GITHUB_OUTPUT
          echo "Nanecisto by se smazalo souboru: $smaze"
          echo "### Co by se smazalo: $smaze souboru" >> $GITHUB_STEP_SUMMARY
          grep -E "$VZOR" nanecisto.txt | head -40 >> $GITHUB_STEP_SUMMARY || true

      - name: Zastavit se, když je mazání podezřele velké
        if: inputs.zkusebni_soubor == false && inputs.nanecisto == false && inputs.velky_uklid == false
        run: |
          if [ -z "${{ steps.zkouska.outputs.smaze }}" ]; then
            echo "Pocet mazanych souboru se nepodarilo zjistit, nepokracuji."
            exit 1
          fi
          if [ "${{ steps.zkouska.outputs.smaze }}" -ge "$STROP_MAZANI" ]; then
            echo "Nahravani by smazalo ${{ steps.zkouska.outputs.smaze }} souboru."
            echo "To je vic nez strop $STROP_MAZANI, takze se nic nenahralo."
            echo ""
            echo "Bud je FTP_ADRESAR spatne a miri jinam nez na web,"
            echo "nebo jde o prvni nahrani pres stary web - a to je v poradku."
            echo "Seznam je vys ve shrnuti. Kdyz sedi, spustte znovu"
            echo "a zaskrtnete 'Povolit i velky uklid'."
            exit 1
          fi
          echo "Smaze se ${{ steps.zkouska.outputs.smaze }} souboru, to je v mezich."

      # Nahrává se nadvakrát, a to schválně.
      #
      # lftp porovnává soubory podle velikosti a času změny. Sestavení v CI
      # vyrábí soubory pokaždé znovu, takže mají čas „teď" a lftp je všechny
      # považuje za novější než ty na serveru — při každém nasazení by se tedy
      # znovu přenášelo 6 MB obrázků, i když se nezměnily.
      #
      # Obrázky a styly mají v názvu otisk obsahu: když se soubor změní, změní
      # se i jeho jméno. Stejné jméno tedy znamená stejný obsah a čas se u nich
      # může ignorovat. U stránek to neplatí — index.html se jmenuje pořád
      # stejně a úprava textu nemusí změnit jeho velikost, takže se přenášejí
      # vždycky. Je jich patnáct a jsou malé.
      - name: Nahrát na FTP
        if: inputs.zkusebni_soubor == false && inputs.nanecisto == false
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          UZIVATEL: ${{ secrets.FTP_UZIVATEL }}
          LFTP_PASSWORD: ${{ secrets.FTP_HESLO }}
          ADRESAR: ${{ vars.FTP_ADRESAR || secrets.FTP_ADRESAR }}
        run: |
          ADR="${ADRESAR%/}"
          cp spojeni.lftp prikazy.lftp
          {
            echo "echo --- 1/2: obrazky a styly ---"
            echo "mirror --reverse --delete --ignore-time --verbose dist/_astro/ \"$ADR/_astro/\""
            echo "echo --- 2/2: stranky a zbytek ---"
            echo "mirror --reverse --delete --verbose --exclude-glob .well-known/ --exclude-glob _astro/ dist/ \"$ADR\""
            echo "bye"
          } >> prikazy.lftp

          lftp -u "$UZIVATEL" --env-password "$SERVER" < prikazy.lftp

      # Jestli soubor .htaccess na serveru leží, se zvenčí zjistit nedá:
      # server na něj vrací 403 i tehdy, když tam vůbec není (chrání ho
      # plošným pravidlem). Zeptáme se proto přes FTP, kde je vidět skutečný
      # obsah složky. Na tom závisí výklad toho, proč nefunguje vlastní
      # stránka 404: jinak nahrávání, jinak nastavení hostingu.
      - name: Ověřit, že .htaccess je na serveru
        if: inputs.zkusebni_soubor == false && inputs.nanecisto == false
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          UZIVATEL: ${{ secrets.FTP_UZIVATEL }}
          LFTP_PASSWORD: ${{ secrets.FTP_HESLO }}
          ADRESAR: ${{ vars.FTP_ADRESAR || secrets.FTP_ADRESAR }}
        run: |
          ADR="${ADRESAR%/}"
          cp spojeni.lftp prikazy.lftp
          {
            echo "cls -a -l \"$ADR\""
            echo "bye"
          } >> prikazy.lftp

          lftp -u "$UZIVATEL" --env-password "$SERVER" < prikazy.lftp > obsah.txt 2>&1 || true

          echo "## Soubory v korenu webu" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if grep -q "htaccess" obsah.txt; then
            echo "- Soubor .htaccess na serveru **je**." >> $GITHUB_STEP_SUMMARY
            echo "  Kdyz presto nefunguje vlastni stranka 404, hosting nebere" >> $GITHUB_STEP_SUMMARY
            echo "  ErrorDocument z .htaccess a musi se to nastavit u nej." >> $GITHUB_STEP_SUMMARY
          else
            echo "- Soubor .htaccess na serveru **neni**." >> $GITHUB_STEP_SUMMARY
            echo "  Nahravani ho tedy neprenaslo - chyba je na nasi strane." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -v "^----\|^\*\*\*\|^<---\|^--->" obsah.txt | head -40 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Po nahrání se web opravdu navštíví. „Soubory jsou na serveru"
      # a „web funguje" nejsou totéž — server je může servírovat jinak, než
      # čekáme. Otazník v adrese obchází mezipaměť hostingu.
      - name: Zkontrolovat nasazený web
        if: inputs.zkusebni_soubor == false && inputs.nanecisto == false
        run: |
          CHYBY=0
          echo "## Kontrola nasazeneho webu" >> $GITHUB_STEP_SUMMARY

          TELO=$(curl -s -m 30 "$WEB/?x=$GITHUB_RUN_ID")
          if echo "$TELO" | grep -q "Jdetoijinak"; then
            echo "- Uvodni stranka: nova verze webu" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Uvodni stranka neni ta nova**" >> $GITHUB_STEP_SUMMARY
            CHYBY=$((CHYBY+1))
          fi

          if echo "$TELO" | grep -q "noindex"; then
            echo "- **Ostry web ma noindex**" >> $GITHUB_STEP_SUMMARY
            CHYBY=$((CHYBY+1))
          else
            echo "- Bez noindex, jak ma byt" >> $GITHUB_STEP_SUMMARY
          fi

          KOD=$(curl -s -m 30 -o ctyristactyri.html -w "%{http_code}" "$WEB/neexistuje-$GITHUB_RUN_ID")
          if [ "$KOD" = "404" ]; then
            echo "- Neexistujici adresa vraci 404" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Neexistujici adresa vraci $KOD misto 404**" >> $GITHUB_STEP_SUMMARY
            CHYBY=$((CHYBY+1))
          fi
          if grep -q "Tuhle stranku\|Tuhle stránku" ctyristactyri.html; then
            echo "- Ukazuje se nase stranka 404" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Ukazuje se serverova stranka 404, ne nase.**" >> $GITHUB_STEP_SUMMARY
            echo "  Server tedy nebere ErrorDocument z .htaccess a musi se to" >> $GITHUB_STEP_SUMMARY
            echo "  nastavit v administraci hostingu." >> $GITHUB_STEP_SUMMARY
            CHYBY=$((CHYBY+1))
          fi

          KOD=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$WEB/.htaccess")
          echo "- Soubor .htaccess: HTTP $KOD (403 znamena, ze tam je a je chraneny)" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$CHYBY" -gt 0 ]; then
            echo "Nasel jsem $CHYBY veci, ktere nesedi. Web je nahrany, ale projdete si je." >> $GITHUB_STEP_SUMMARY
          else
            echo "Vse v poradku." >> $GITHUB_STEP_SUMMARY
          fi

      # Žádné zrcadlení, žádné mazání — jen jeden soubor navíc a výpis složky.
      - name: Nahrát zkušební soubor a vypsat obsah složky
        if: inputs.zkusebni_soubor == true
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          UZIVATEL: ${{ secrets.FTP_UZIVATEL }}
          LFTP_PASSWORD: ${{ secrets.FTP_HESLO }}
          ADRESAR: ${{ vars.FTP_ADRESAR || secrets.FTP_ADRESAR }}
        run: |
          set -o pipefail
          ADR="${ADRESAR%/}"
          echo ">> Adresar, do ktereho nahravam: '$ADR'"
          echo "   (kdyz se misto nej vypisuje ***, je ulozeny jako secret;"
          echo "    prehodte ho do Variables, at je v zaznamu videt)"

          {
            echo "Zkusebni soubor z nasazeni webu Transparentni Vyskov."
            echo "Overuje jen to, ze funguje pripojeni na FTP."
            echo "Da se kdykoliv smazat."
            echo ""
            echo "Beh: $GITHUB_RUN_ID"
          } > zkouska-nasazeni.txt

          cp spojeni.lftp prikazy.lftp
          {
            echo "echo --- kde jsem po prihlaseni ---"
            echo "pwd"
            echo "echo --- co lezi hned po prihlaseni ---"
            echo "cls -l"
            echo "echo --- nahravam zkusebni soubor ---"
            echo "put -O \"$ADR\" zkouska-nasazeni.txt"
            echo "echo --- co lezi v cilove slozce ---"
            echo "cls -l \"$ADR\""
            echo "bye"
          } >> prikazy.lftp

          lftp -u "$UZIVATEL" --env-password "$SERVER" < prikazy.lftp | tee vypis.txt

      - name: Vypsat, co ve složce leží
        if: inputs.zkusebni_soubor == true
        env:
          ADRESAR: ${{ vars.FTP_ADRESAR || secrets.FTP_ADRESAR }}
        run: |
          echo "## Zkusebni soubor nahran" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Beh dobehl bez chyby, takze prihlasovaci udaje funguji" >> $GITHUB_STEP_SUMMARY
          echo "a server soubor prijal. Web zustal nedotceny." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Zkuste si ho otevrit na $WEB/zkouska-nasazeni.txt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Otevre se: domena uz na tenhle hosting miri." >> $GITHUB_STEP_SUMMARY
          echo "- Neotevre se: nahrani proslo, ale domena miri jinam a bude" >> $GITHUB_STEP_SUMMARY
          echo "  potreba prepnout DNS. Pak pozor na MX zaznamy, aby neprestala" >> $GITHUB_STEP_SUMMARY
          echo "  chodit posta." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Co lezi v $ADRESAR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -60 vypis.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Shrnutí
        if: always() && inputs.zkusebni_soubor == false
        run: |
          if [ "${{ inputs.nanecisto }}" = "true" ]; then
            echo "Byla to zkouska nanecisto, na webu se nic nezmenilo." >> $GITHUB_STEP_SUMMARY
          else
            echo "Web je na ostre adrese." >> $GITHUB_STEP_SUMMARY
          fi
