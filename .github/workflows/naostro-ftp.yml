# Nahraje hotový web na FTP (Wedos) — tedy NAOSTRO, na vlastní doménu.
#
# Spouští se JEN RUČNĚ tlačítkem: karta Actions → „Naostro na FTP" →
# „Run workflow" → „Run workflow". Schválně tu není `on: push`. Draft na
# GitHub Pages se nasazuje sám při každé změně v `main`, tým si ho projde,
# a teprve když ho odsouhlasí, pustí se tenhle běh.
#
# Než to půjde poprvé spustit, musí být v repozitáři na GitHubu vyplněné
# přihlašovací údaje — Settings → Secrets and variables → Actions →
# New repository secret. Potřeba jsou čtyři:
#
#   FTP_SERVER    adresa FTP serveru, třeba ftp.transparentnivyskov.cz
#   FTP_UZIVATEL  přihlašovací jméno
#   FTP_HESLO     heslo
#
# A k tomu složka na serveru, do které web patří. Ta tajná není, takže patří
# spíš do Variables (tamtéž, záložka „Variables") pod názvem FTP_ADRESAR —
# hodnoty ze secrets GitHub v záznamu běhu maskuje hvězdičkami, takže by
# v diagnostickém výpisu nebylo vidět, kam se vlastně nahrálo. Když je
# uložená jako secret, funguje to taky, jen se hůř hledají chyby.
#
# FTP_ADRESAR je složka, kterou hosting servíruje jako web — bývá to
# `/public_html/`. Když se netrefí, web se nahraje vedle a na doméně se nic
# nezmění.
#
# Na první ověření je ve formuláři přepínač „Jen zkušební soubor": nahraje
# jediný neškodný textový soubor a vypíše obsah složky, takže se přístupy
# i adresář dají zkontrolovat, aniž by se na web sáhlo.
#
# POZOR, tohle je ta nebezpečná část: nahrávání je zrcadlení. Co je ve
# složce na serveru navíc oproti `dist/`, to se SMAŽE — jinak by tam po
# každé změně zůstávaly staré stránky. Kdyby byl FTP_ADRESAR špatně a mířil
# třeba do kořene FTP, zrcadlení by smazalo i věci, které s webem nesouvisí.
#
# Proti tomu je pojistka: běh si napřed nanečisto spočítá, kolik souborů by
# smazal, a když je to moc, zastaví se a vypíše je. Běžná aktualizace webu
# smaže pár souborů; když jich má být sto a víc, je něco špatně — nebo jde
# o první nahrání přes starý web, což je v pořádku, jen to musí někdo
# potvrdit zaškrtnutím „velký úklid".

name: Naostro na FTP

on:
  workflow_dispatch:
    inputs:
      zkusebni_soubor:
        description: 'Jen zkušební soubor — ověřit přístupy a vypsat obsah složky, web nechat být'
        type: boolean
        default: false
      nanecisto:
        description: 'Jen nanečisto — vypsat, co by se stalo, a nic nenahrávat'
        type: boolean
        default: false
      velky_uklid:
        description: 'Povolit i velký úklid (potřeba při prvním nahrání přes starý web)'
        type: boolean
        default: false

# Dvě nahrávání naráz by si na serveru lezla do zelí. Rozdělaný běh se
# nepřerušuje — přerušit nahrávání v půlce by nechalo web rozbitý.
concurrency:
  group: ftp-naostro
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Nad tolik smazaných souborů se běh zastaví a počká na potvrzení.
  STROP_MAZANI: 100

jobs:
  naostro:
    runs-on: ubuntu-latest
    steps:
      - name: Zkontrolovat, že jsou vyplněné údaje
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          UZIVATEL: ${{ secrets.FTP_UZIVATEL }}
          HESLO: ${{ secrets.FTP_HESLO }}
          ADRESAR: ${{ vars.FTP_ADRESAR || secrets.FTP_ADRESAR }}
        run: |
          chybi=""
          [ -z "$SERVER" ] && chybi="$chybi FTP_SERVER"
          [ -z "$UZIVATEL" ] && chybi="$chybi FTP_UZIVATEL"
          [ -z "$HESLO" ] && chybi="$chybi FTP_HESLO"
          [ -z "$ADRESAR" ] && chybi="$chybi FTP_ADRESAR"
          if [ -n "$chybi" ]; then
            echo "Chybi tyto udaje:$chybi"
            echo "Doplnte je v Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Stáhnout zdrojové soubory
        if: inputs.zkusebni_soubor == false
        uses: actions/checkout@v7

      - name: Připravit Node.js
        if: inputs.zkusebni_soubor == false
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Nainstalovat závislosti
        if: inputs.zkusebni_soubor == false
        run: npm ci

      - name: Sestavit web naostro
        if: inputs.zkusebni_soubor == false
        # NAOSTRO=1 přepne odkazy z podsložky /TV-web/ do kořene domény
        # a shodí pruh „Náhled" i `noindex`. Bez toho by na doméně skončil
        # web, který se tváří jako draft a má rozbité odkazy.
        env:
          NAOSTRO: '1'
        run: npm run build

      - name: Ověřit, že sestavení není draft
        if: inputs.zkusebni_soubor == false
        # Levná pojistka. Kdyby se NAOSTRO někdy přestalo propisovat, chyba
        # se pozná tady, ne až na doméně.
        run: |
          if grep -q "noindex" dist/index.html; then
            echo "Sestaveni ma noindex, tedy je to draft. Naostro se nenahraje."
            exit 1
          fi
          if grep -q '"/TV-web/' dist/index.html; then
            echo "Sestaveni ma odkazy do podslozky /TV-web/, tedy je to draft."
            exit 1
          fi
          if grep -rq "toto zatim neni zivy web\|toto zatím není živý web" dist/; then
            echo "Sestaveni ma pruh 'Nahled', tedy je to draft."
            exit 1
          fi
          echo "V poradku: sestaveni je ostre - bez pruhu, bez noindex, odkazy v koreni."

      - name: Nainstalovat lftp
        # Schválně obyčejné lftp, ne hotová akce z Marketplace: přihlašovací
        # údaje k ostrému webu tak nikdy neopustí běh u GitHubu a nikdo
        # třetí je nevidí.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Spočítat nanečisto, co by se smazalo
        if: inputs.zkusebni_soubor == false
        id: zkouska
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          UZIVATEL: ${{ secrets.FTP_UZIVATEL }}
          LFTP_PASSWORD: ${{ secrets.FTP_HESLO }}
          ADRESAR: ${{ vars.FTP_ADRESAR || secrets.FTP_ADRESAR }}
          FTP_KONTROLOVAT_JMENO: ${{ vars.FTP_KONTROLOVAT_JMENO }}
          FTP_OVERIT_CERTIFIKAT: ${{ vars.FTP_OVERIT_CERTIFIKAT }}
        run: |
          # Certifikát FTP serveru bývá na sdíleném hostingu vystavený na jméno
          # poskytovatele, ne na tu adresu, přes kterou se člověk připojuje.
          # Spojení je pak šifrované, jen se neshodne jméno.
          #
          # Řídí to dvě proměnné (Settings > Secrets and variables > Actions >
          # Variables). Obě se nechávají nevyplněné a nastavují se jen tehdy,
          # když se připojení nepovede. Hodnota je vždycky slovo `ne`:
          #
          #   FTP_KONTROLOVAT_JMENO = ne   certifikát se dál ověřuje, jen se
          #                                neřeší, že je na jiné jméno
          #   FTP_OVERIT_CERTIFIKAT = ne   certifikát se neověřuje vůbec;
          #                                až když nepomůže to první
          if [ "${FTP_OVERIT_CERTIFIKAT:-ano}" = "ne" ]; then
            SSL='set ssl:verify-certificate false'
            echo ">> Certifikat: neoveruji vubec (spojeni je porad sifrovane)"
          elif [ "${FTP_KONTROLOVAT_JMENO:-ano}" = "ne" ]; then
            SSL='set ssl:verify-certificate true
          set ssl:check-hostname false'
            echo ">> Certifikat: overuji, na jmeno se neptam"
          else
            SSL='set ssl:verify-certificate true
          set ssl:check-hostname true'
            echo ">> Certifikat: overuji certifikat i jmeno"
          fi

          lftp -u "$UZIVATEL" --env-password "$SERVER" <<LFTP > nanecisto.txt 2>&1 || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          # Bez `-a` server ve vypisu neuvadi soubory zacinajici teckou, takze
          # by se `.htaccess` nemusel prenest ani porovnat - a nastaveni serveru
          # by tise chybelo.
          set ftp:list-options -a
          $SSL
          set net:max-retries 3
          set net:timeout 20
          mirror --reverse --delete --dry-run --verbose \
            --exclude-glob .well-known/ \
            dist/ "$ADRESAR"
          bye
          LFTP

          # lftp podle verze vypisuje bud prikaz (`rm ...`), nebo vetu
          # („Removing old file ..."). Hlidame obojí, at se pojistka
          # nerozbije o jinou verzi lftp na runneru.
          VZOR='^(rm|rmdir) |Removing old'
          smaze=$(grep -c -E "$VZOR" nanecisto.txt || true)
          echo "smaze=$smaze" >> $GITHUB_OUTPUT
          echo "Nanecisto by se smazalo souboru: $smaze"
          echo "### Co by se smazalo: $smaze souboru" >> $GITHUB_STEP_SUMMARY
          grep -E "$VZOR" nanecisto.txt | head -40 >> $GITHUB_STEP_SUMMARY || true

      - name: Zastavit se, když je mazání podezřele velké
        if: inputs.zkusebni_soubor == false && inputs.nanecisto == false && inputs.velky_uklid == false
        run: |
          if [ "${{ steps.zkouska.outputs.smaze }}" -ge "$STROP_MAZANI" ]; then
            echo "Nahravani by smazalo ${{ steps.zkouska.outputs.smaze }} souboru."
            echo "To je vic nez strop $STROP_MAZANI, takze se nic nenahralo."
            echo ""
            echo "Bud je FTP_ADRESAR spatne a miri jinam nez na web,"
            echo "nebo jde o prvni nahrani pres stary web - a to je v poradku."
            echo "Seznam je vys ve shrnuti. Kdyz sedi, spustte znovu"
            echo "a zaskrtnete 'Povolit i velky uklid'."
            exit 1
          fi
          echo "Smaze se ${{ steps.zkouska.outputs.smaze }} souboru, to je v mezich."

      - name: Nahrát na FTP
        if: inputs.zkusebni_soubor == false && inputs.nanecisto == false
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          UZIVATEL: ${{ secrets.FTP_UZIVATEL }}
          # lftp si heslo přečte z prostředí (`--env-password`), takže se
          # neobjeví v příkazu ani v seznamu procesů.
          LFTP_PASSWORD: ${{ secrets.FTP_HESLO }}
          ADRESAR: ${{ vars.FTP_ADRESAR || secrets.FTP_ADRESAR }}
          FTP_KONTROLOVAT_JMENO: ${{ vars.FTP_KONTROLOVAT_JMENO }}
          FTP_OVERIT_CERTIFIKAT: ${{ vars.FTP_OVERIT_CERTIFIKAT }}
        run: |
          # Certifikát FTP serveru bývá na sdíleném hostingu vystavený na jméno
          # poskytovatele, ne na tu adresu, přes kterou se člověk připojuje.
          # Spojení je pak šifrované, jen se neshodne jméno.
          #
          # Řídí to dvě proměnné (Settings > Secrets and variables > Actions >
          # Variables). Obě se nechávají nevyplněné a nastavují se jen tehdy,
          # když se připojení nepovede. Hodnota je vždycky slovo `ne`:
          #
          #   FTP_KONTROLOVAT_JMENO = ne   certifikát se dál ověřuje, jen se
          #                                neřeší, že je na jiné jméno
          #   FTP_OVERIT_CERTIFIKAT = ne   certifikát se neověřuje vůbec;
          #                                až když nepomůže to první
          if [ "${FTP_OVERIT_CERTIFIKAT:-ano}" = "ne" ]; then
            SSL='set ssl:verify-certificate false'
            echo ">> Certifikat: neoveruji vubec (spojeni je porad sifrovane)"
          elif [ "${FTP_KONTROLOVAT_JMENO:-ano}" = "ne" ]; then
            SSL='set ssl:verify-certificate true
          set ssl:check-hostname false'
            echo ">> Certifikat: overuji, na jmeno se neptam"
          else
            SSL='set ssl:verify-certificate true
          set ssl:check-hostname true'
            echo ">> Certifikat: overuji certifikat i jmeno"
          fi

          lftp -u "$UZIVATEL" --env-password "$SERVER" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          # Bez `-a` server ve vypisu neuvadi soubory zacinajici teckou, takze
          # by se `.htaccess` nemusel prenest ani porovnat - a nastaveni serveru
          # by tise chybelo.
          set ftp:list-options -a
          $SSL
          set net:max-retries 3
          set net:timeout 20
          set cmd:fail-exit true
          mirror --reverse --delete --verbose --parallel=3 \
            --exclude-glob .well-known/ \
            dist/ "$ADRESAR"
          bye
          LFTP

      - name: Nahrát zkušební soubor a vypsat obsah složky
        # Žádný `mirror`, žádné `--delete` — jen jeden `put` a výpis. Web se
        # tím nezmění, jen v jeho složce přibude textový soubor, který jde
        # kdykoliv smazat.
        if: inputs.zkusebni_soubor == true
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          UZIVATEL: ${{ secrets.FTP_UZIVATEL }}
          LFTP_PASSWORD: ${{ secrets.FTP_HESLO }}
          ADRESAR: ${{ vars.FTP_ADRESAR || secrets.FTP_ADRESAR }}
          FTP_KONTROLOVAT_JMENO: ${{ vars.FTP_KONTROLOVAT_JMENO }}
          FTP_OVERIT_CERTIFIKAT: ${{ vars.FTP_OVERIT_CERTIFIKAT }}
        run: |
          {
            echo "Zkusebni soubor z nasazeni webu Transparentni Vyskov."
            echo "Overuje jen to, ze funguje pripojeni na FTP."
            echo "Da se kdykoliv smazat."
            echo ""
            echo "Beh: ${{ github.run_id }}"
            echo "Vytvoreno: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > zkouska-nasazeni.txt

          echo ">> Adresar, do ktereho nahravam: '$ADRESAR'"
          echo "   (kdyz se misto nej vypisuje ***, je ulozeny jako secret;"
          echo "    prehodte ho do Variables, at je v logu videt)"

          # Certifikát FTP serveru bývá na sdíleném hostingu vystavený na jméno
          # poskytovatele, ne na tu adresu, přes kterou se člověk připojuje.
          # Spojení je pak šifrované, jen se neshodne jméno.
          #
          # Řídí to dvě proměnné (Settings > Secrets and variables > Actions >
          # Variables). Obě se nechávají nevyplněné a nastavují se jen tehdy,
          # když se připojení nepovede. Hodnota je vždycky slovo `ne`:
          #
          #   FTP_KONTROLOVAT_JMENO = ne   certifikát se dál ověřuje, jen se
          #                                neřeší, že je na jiné jméno
          #   FTP_OVERIT_CERTIFIKAT = ne   certifikát se neověřuje vůbec;
          #                                až když nepomůže to první
          if [ "${FTP_OVERIT_CERTIFIKAT:-ano}" = "ne" ]; then
            SSL='set ssl:verify-certificate false'
            echo ">> Certifikat: neoveruji vubec (spojeni je porad sifrovane)"
          elif [ "${FTP_KONTROLOVAT_JMENO:-ano}" = "ne" ]; then
            SSL='set ssl:verify-certificate true
          set ssl:check-hostname false'
            echo ">> Certifikat: overuji, na jmeno se neptam"
          else
            SSL='set ssl:verify-certificate true
          set ssl:check-hostname true'
            echo ">> Certifikat: overuji certifikat i jmeno"
          fi

          # `set -o pipefail` je tu nutny: bez nej ma roura navratovy kod
          # posledniho clanku, tedy `tee`. Kdyby lftp selhalo, krok by presto
          # skoncil uspechem a nikdo by se o chybe nedozvedel.
          set -o pipefail
          lftp -u "$UZIVATEL" --env-password "$SERVER" <<LFTP | tee vypis.txt
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          # Bez `-a` server ve vypisu neuvadi soubory zacinajici teckou, takze
          # by se `.htaccess` nemusel prenest ani porovnat - a nastaveni serveru
          # by tise chybelo.
          set ftp:list-options -a
          $SSL
          set net:max-retries 2
          set net:timeout 20
          set cmd:fail-exit true
          echo "--- kde jsem po prihlaseni ---"
          pwd
          echo "--- co lezi hned po prihlaseni ---"
          cls -l
          echo "--- nahravam zkusebni soubor ---"
          put -O "$ADRESAR" zkouska-nasazeni.txt
          echo "--- co lezi v cilove slozce ---"
          cls -l "$ADRESAR"
          bye
          LFTP

      - name: Vypsat, co ve složce leží
        if: inputs.zkusebni_soubor == true
        env:
          ADRESAR: ${{ vars.FTP_ADRESAR || secrets.FTP_ADRESAR }}
        run: |
          echo "## Zkusebni soubor nahran" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Beh dobehl bez chyby, takze prihlasovaci udaje funguji" >> $GITHUB_STEP_SUMMARY
          echo "a server soubor prijal. Web zustal nedotceny." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Soubor se jmenuje \`zkouska-nasazeni.txt\` a lezi primo" >> $GITHUB_STEP_SUMMARY
          echo "v korenu webu. Az ho nebudete potrebovat, smazte ho" >> $GITHUB_STEP_SUMMARY
          echo "FTP klientem." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Zkuste si ho otevrit na** \`https://transparentnivyskov.cz/zkouska-nasazeni.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tim se zjisti to jedine, co je krome pristupu potreba vedet:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Otevre se** = domena uz na tenhle hosting miri. Po ostrem" >> $GITHUB_STEP_SUMMARY
          echo "  nahrani bude novy web na doméne hned a s DNS neni co resit." >> $GITHUB_STEP_SUMMARY
          echo "- **Neotevre se** (404 nebo stary web) = domena miri jinam." >> $GITHUB_STEP_SUMMARY
          echo "  Nahrani projde, ale na doméne se nic nezmeni, dokud se" >> $GITHUB_STEP_SUMMARY
          echo "  neprepnou DNS. Pak pozor na MX zaznamy, aby nepresla posta." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Co lezi v $ADRESAR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -60 vypis.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Shrnutí
        if: always() && inputs.zkusebni_soubor == false
        run: |
          if [ "${{ inputs.nanecisto }}" = "true" ]; then
            echo "Byla to zkouska nanecisto, na webu se nic nezmenilo." >> $GITHUB_STEP_SUMMARY
          else
            echo "Web je na ostre adrese." >> $GITHUB_STEP_SUMMARY
          fi
