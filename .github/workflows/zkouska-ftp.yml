# Zkouška FTP připojení — nahraje na server jeden neškodný textový soubor.
#
# K čemu to je: než se pustí ostré nasazení, které web na serveru přepíše,
# je dobré vědět, že přihlašovací údaje fungují a že `FTP_ADRESAR` míří
# tam, kam má. Tenhle běh se připojuje úplně stejně jako ostré nasazení,
# ale NIC NEMAŽE a nic nepřepisuje — jen přidá soubor `zkouska-nasazeni.txt`
# a vypíše, co ve složce leží.
#
# Ten výpis je na tom to hlavní: podle něj se pozná, jestli `FTP_ADRESAR`
# míří do složky, kterou hosting servíruje jako web.
#
# Na novém hostingu u Wedosu bude složka nejspíš prázdná nebo v ní bude
# jen úvodní `index.html` od Wedosu — to je v pořádku, starý WordPress
# běží u jiného poskytovatele. Důležité je, že se výpis vůbec povede
# a že jde o tu složku, kterou Wedos uvádí jako korenovou pro web.
#
# Kdyby se výpis nepovedl nebo v něm byly úplně cizí věci, ostré nasazení
# by web nahrálo vedle a na doméně by se nic nezměnilo.
#
# Používá stejné čtyři secrets jako ostré nasazení, takže se tím zároveň
# ověří, že jsou vyplněné správně:
#   FTP_SERVER, FTP_UZIVATEL, FTP_HESLO, FTP_ADRESAR
#
# Až zkoušku doděláte, spusťte tenhle běh ještě jednou se zaškrtnutým
# „uklidit po sobě" — zkušební soubor se ze serveru smaže.

name: Zkouška FTP připojení

on:
  workflow_dispatch:
    inputs:
      uklidit:
        description: 'Uklidit po sobě — místo nahrání zkušební soubor ze serveru smazat'
        type: boolean
        default: false

concurrency:
  group: ftp-naostro
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOUBOR: zkouska-nasazeni.txt

jobs:
  zkouska:
    runs-on: ubuntu-latest
    steps:
      - name: Zkontrolovat, že jsou vyplněné údaje
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          UZIVATEL: ${{ secrets.FTP_UZIVATEL }}
          HESLO: ${{ secrets.FTP_HESLO }}
          ADRESAR: ${{ secrets.FTP_ADRESAR }}
        run: |
          chybi=""
          [ -z "$SERVER" ] && chybi="$chybi FTP_SERVER"
          [ -z "$UZIVATEL" ] && chybi="$chybi FTP_UZIVATEL"
          [ -z "$HESLO" ] && chybi="$chybi FTP_HESLO"
          [ -z "$ADRESAR" ] && chybi="$chybi FTP_ADRESAR"
          if [ -n "$chybi" ]; then
            echo "Chybi tyto udaje:$chybi"
            echo "Doplnte je v Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Nainstalovat lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Připravit zkušební soubor
        if: inputs.uklidit == false
        run: |
          {
            echo "Zkusebni soubor z nasazeni webu Transparentni Vyskov."
            echo "Overuje jen to, ze funguje pripojeni na FTP."
            echo "Da se kdykoliv smazat."
            echo ""
            echo "Beh: ${{ github.run_id }}"
            echo "Vytvoreno: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > "$SOUBOR"
          cat "$SOUBOR"

      - name: Nahrát zkušební soubor a vypsat obsah složky
        if: inputs.uklidit == false
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          UZIVATEL: ${{ secrets.FTP_UZIVATEL }}
          LFTP_PASSWORD: ${{ secrets.FTP_HESLO }}
          ADRESAR: ${{ secrets.FTP_ADRESAR }}
        run: |
          # Zadny `mirror`, zadne `--delete`. Jen jeden `put` a vypis.
          lftp -u "$UZIVATEL" --env-password "$SERVER" <<LFTP | tee vypis.txt
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          set net:timeout 20
          set cmd:fail-exit true
          put -O "$ADRESAR" "$SOUBOR"
          cls -l "$ADRESAR"
          bye
          LFTP

      - name: Smazat zkušební soubor
        if: inputs.uklidit == true
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          UZIVATEL: ${{ secrets.FTP_UZIVATEL }}
          LFTP_PASSWORD: ${{ secrets.FTP_HESLO }}
          ADRESAR: ${{ secrets.FTP_ADRESAR }}
        run: |
          lftp -u "$UZIVATEL" --env-password "$SERVER" <<LFTP | tee vypis.txt
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set cmd:fail-exit true
          rm -f "$ADRESAR/$SOUBOR"
          cls -l "$ADRESAR"
          bye
          LFTP

      - name: Shrnutí
        if: always()
        env:
          ADRESAR: ${{ secrets.FTP_ADRESAR }}
        run: |
          if [ "${{ inputs.uklidit }}" = "true" ]; then
            echo "## Zkusebni soubor smazan" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Zkusebni soubor nahran" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Uz to, ze beh dobehl bez chyby, znamena, ze prihlasovaci" >> $GITHUB_STEP_SUMMARY
            echo "udaje funguji a server prijal soubor." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Jestli soubor sedi i na spravnem miste, se pozna z vypisu" >> $GITHUB_STEP_SUMMARY
            echo "nize. V prohlizeci se da otevrit takto:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- pres technickou adresu hostingu (je v administraci Wedosu)" >> $GITHUB_STEP_SUMMARY
            echo "  na \`.../$SOUBOR\`" >> $GITHUB_STEP_SUMMARY
            echo "- na \`https://transparentnivyskov.cz/$SOUBOR\` teprve az" >> $GITHUB_STEP_SUMMARY
            echo "  se domena prepne na Wedos. Dokud miri jinam, ukaze se stary web." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Co lezi v $ADRESAR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -60 vypis.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(vypis se nepodaril)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Na novem hostingu bude slozka nejspis prazdna nebo v ni bude" >> $GITHUB_STEP_SUMMARY
          echo "jen uvodni index.html od Wedosu - to je v poradku. Overte si" >> $GITHUB_STEP_SUMMARY
          echo "v administraci Wedosu, ze je to opravdu korenova slozka webu." >> $GITHUB_STEP_SUMMARY
